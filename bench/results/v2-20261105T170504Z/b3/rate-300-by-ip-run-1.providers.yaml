# Everything points at the mock providers. Used by tests, benchmarks and the
# default docker compose stack, so no real keys are ever needed. gpt-4o-mini
# fails over from mock to mock-secondary, two separate mock processes in the
# stack; tests that run the gateway in-process send both to one mock app.
providers:
  - name: mock
    type: openai_compat
    base_url: http://172.19.0.4:8001/v1
    timeout_s: 60
    connect_timeout_s: 3
    forward_mock_headers: true
  - name: mock-secondary
    type: openai_compat
    base_url: http://172.19.0.2:8001/v1
    forward_mock_headers: true

models:
  gpt-4o-mini:
    routes: [mock, mock-secondary]
    price_per_1m: {input: 0.15, output: 0.60}
  llama3.1:8b:
    routes: [mock]
    price_per_1m: {input: 0, output: 0}
