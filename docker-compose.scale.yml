# Three gateway replicas behind nginx, sharing Postgres and Redis (SPEC C2):
#
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml up -d
#
# nginx takes over port 8000; the replicas are reachable only through it.
services:
  gateway:
    ports: !reset []
    deploy:
      replicas: 3

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:8000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      gateway:
        condition: service_healthy
