# Fronts the gateway replicas of docker-compose.scale.yml. Docker's DNS returns
# one address per replica for `gateway`; nginx resolves it at startup and
# round-robins across them, so restart nginx after changing the replica count.

worker_processes auto;

events {
    # Each proxied request holds two connections: client side and gateway side.
    worker_connections 4096;
}

http {
    access_log off;  # the gateway logs every request, without prompts

    upstream gateway {
        server gateway:8000;
        keepalive 64;
    }

    server {
        listen 8000;
        # The gateway enforces its own body limit, with an OpenAI-shaped 413.
        client_max_body_size 0;

        location / {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";  # keep upstream connections alive
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Streams: pass each SSE chunk on as it arrives, and let them run long.
            proxy_buffering off;
            proxy_read_timeout 600s;
            # nginx never retries a POST on another replica (it isn't idempotent),
            # so a request that reached a gateway is never sent twice.
            proxy_next_upstream error timeout;
        }
    }
}
