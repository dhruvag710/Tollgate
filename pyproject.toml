[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tollgate"
version = "0.1.0"
description = "Self-hosted, OpenAI-compatible LLM gateway"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    # Its network backend API: providers/resolver.py connects through a cache of
    # addresses, so no request waits on a name lookup.
    "httpcore>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "tiktoken>=0.8",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "redis[hiredis]>=5.0",  # hiredis: a native reply parser, ~30% less CPU per call
    "prometheus-client>=0.20",
    # httpcore imports sniffio on every call. Without it each attempt fails, and a
    # failed import isn't cached: it searches sys.path again, ~4 times a request.
    "sniffio>=1.3",
    # The semantic cache's vectors, in Postgres (SQLAlchemy column type).
    "pgvector>=0.3",
]

[project.optional-dependencies]
dev = [
    "openai>=1.40",
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "testcontainers[postgres,redis]>=4.8",
]
# The semantic cache's embedder (SPEC Phase 2.4). Pulls in PyTorch: install the
# CPU-only wheel first (pip install torch --index-url
# https://download.pytorch.org/whl/cpu) to keep it to a few hundred MB.
semantic = [
    "sentence-transformers>=3.0",
]
# The cache evaluation (bench/cache_eval, SPEC B4) and its charts.
bench = [
    "tollgate[semantic]",
    "matplotlib>=3.8",
    "psutil>=5.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tollgate"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
# A closing summary naming every test that failed, errored or was skipped, so
# no amount of captured output above can hide which one it was.
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "perf: timing-sensitive checks that depend on the machine; CI skips them (-m 'not perf')",
]

[tool.coverage.run]
source = ["src/tollgate"]
branch = true
# SQLAlchemy's async layer runs code in greenlets, which coverage must be told to follow.
concurrency = ["greenlet", "thread"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["tollgate"]

[[tool.mypy.overrides]]
module = ["mock_provider.*"]
disallow_untyped_decorators = false

# The semantic extra isn't installed in CI, and pgvector ships no type hints.
[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "torch.*", "pgvector.*"]
ignore_missing_imports = true
